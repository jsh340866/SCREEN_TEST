<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!-- SWIPER CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    a {
      margin: 0;
      padding: 0;
      text-decoration: none;
      color: black;
    }

    .wrapper {}

    /* */
    .wrapper>header {}

    .wrapper>header>.top-header {}

    .wrapper>header>nav {}

    /* */
    .wrapper>main {}

    .wrapper>main>section {}

    .wrapper>main>section.main-banner {}

    .wrapper>main>section.main-banner>.swiper {
      width: 100%;
      height: 720px;
      position: relative;
    }

    .wrapper>main>section.main-banner>.swiper>.swiper-wrapper {}

    .wrapper>main>section.main-banner>.swiper>.swiper-wrapper>.swiper-slide {}

    .wrapper>main>section.main-banner>.swiper>.swiper-wrapper>.swiper-slide>a {}

    .wrapper>main>section.main-banner>.swiper>.swiper-wrapper>.swiper-slide>a>img {}

    .wrapper>main>section.main-banner>.swiper>.swiper-button-prev,
    .wrapper>main>section.main-banner>.swiper>.swiper-button-next {
      width: 35px;
      height: 35px;
      /* border: 1px solid white; */
      position: absolute;
      border-radius: 50%;
      color: white;
      top: 86%;
    }

    .wrapper>main>section.main-banner>.swiper>.swiper-button-prev {
      left: 25%;
    }
    .wrapper>main>section.main-banner>.swiper>.swiper-button-next {
      left: calc(25% + 180px);
    }

    .wrapper>main>section.main-banner>.swiper>.swiper-button-pagination {}

    /* */
    .wrapper>footer {}
  </style>
</head>

<body>


  <div class="wrapper">
    <div class="top-header"></div>
    <nav></nav>

    <main>
      <!-- BANNER SECTION -->
      <section class="main-banner">
        <!-- Slider main container -->
        <div class="swiper">
          <!-- Additional required wrapper -->
          <div class="swiper-wrapper">
            <!-- Slides -->
            <div class="swiper-slide">
              <a href="javascript:void(0)">
                <img src="./images/1.jpg" alt="">
              </a>
            </div>
            <div class="swiper-slide">
              <a href="javascript:void(0)">
                <img src="./images/2.jpg" alt="">
              </a>
            </div>
            <div class="swiper-slide">
              <a href="javascript:void(0)">
                <img src="./images/3.jpg" alt="">
              </a>
            </div>
            <div class="swiper-slide">
              <a href="javascript:void(0)">
                <img src="./images/4.jpg" alt="">
              </a>
            </div>
            <div class="swiper-slide">
              <a href="javascript:void(0)">
                <img src="./images/5.jpg" alt="">
              </a>
            </div>
          </div>
          <!-- If we need pagination -->
          <div class="swiper-pagination"></div>

          <!-- If we need navigation buttons -->
          <div class="swiper-button-prev"></div>
          <div class="swiper-button-next"></div>

          <!-- If we need scrollbar -->
          <!-- <div class="swiper-scrollbar"></div> -->
        </div>
      </section>

      <section></section>
      <section></section>
      <section></section>
    </main>
    <footer></footer>
  </div>
  <script>
    const mainBannerSwiper = new Swiper('.main-banner>.swiper', {
      // Optional parameters
      direction: 'horizontal',    //vertical : 수직, horizontal : 수평
      autoplay: {
        delay: 2000,
        pauseOnMouseEnter: true,
      },
      loop: true,
      effect: "slide", // slide(기본), fade, scroll, cube, coverflow, flip
      mousewheel: true,

      // If we need pagination
      pagination: {
        el: '.main-banner>.swiper>.swiper-pagination',
        clickable: true,
        type: 'progressbar', //bullets(기본), fraction, progressbar, 
      },

      // Navigation arrows
      navigation: {
        nextEl: '.main-banner>.swiper>.swiper-button-next',
        prevEl: '.main-banner>.swiper>.swiper-button-prev',
      },

      // And if we need scrollbar
      // scrollbar: {
      //   el: '.swiper-scrollbar',
      // },
    });

  </script>
</body>

</html>
